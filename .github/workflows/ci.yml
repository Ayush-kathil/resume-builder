name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Lint
      run: npm run lint
      
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        MONGODB_URI: ${{ secrets['MONGODB_URI'] || 'mongodb://localhost:27017/test' }}
        JWT_SECRET: ${{ secrets['JWT_SECRET'] || 'test_secret' }}
        ADMIN_PASSCODE: ${{ secrets['ADMIN_PASSCODE'] || '1234' }}
        OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] || 'sk-test' }}
